name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      # 只有打标签时才发布单文件便携版
      - name: Publish portable
        if: startsWith(github.ref, 'refs/tags/v')
        run: >
          dotnet publish -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none -p:DebugSymbols=false
          -o publish

      - name: Verify portable output
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Get-Item publish/AngkleChenToolBox.exe | Select-Object Name, Length
          if (-not (Test-Path "publish/AngkleChenToolBox.exe")) { throw "未找到发布产物" }

      - name: Upload build artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: AngkleChenToolBox-${{ github.ref_name }}
          path: publish/AngkleChenToolBox.exe
          retention-days: 30

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/AngkleChenToolBox.exe
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
